<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>حساب کاربری ساخته شد</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000022;
    overflow: hidden;
    font-family: "Vazirmatn", Tahoma, Arial, sans-serif;
  }

  * {
    box-sizing: border-box;
  }

  #stars {
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
  }

  .content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    height: 100dvh;
    text-align: center;
    padding: 0 16px;
  }

  .stack {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .card {
    position: relative;
    z-index: 2;
    background: #ffffff;
    border-radius: clamp(16px, 4vw, 26px);
    padding: clamp(22px, 5vw, 36px) clamp(24px, 6vw, 42px) clamp(18px, 4vw, 30px);
    box-shadow: 0 10px 40px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.05);
    width: min(90vw, 460px);
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: pop 0.5s ease;
  }

  @keyframes pop {
    0% { transform: scale(0.85); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .checkmark {
    width: clamp(52px, 12vw, 72px);
    height: clamp(52px, 12vw, 72px);
    border-radius: 50%;
    background: #22c55e;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: clamp(10px, 3vw, 18px);
    box-shadow: 0 4px 14px rgba(34,197,94,0.45);
  }

  .checkmark svg {
    width: 55%;
    height: 55%;
  }

  .card p {
    margin: 0;
    color: #1a1a2e;
    font-size: clamp(15px, 4vw, 22px);
    font-weight: 600;
    line-height: 1.9;
  }

  #character {
    position: relative;
    z-index: 1;
    width: clamp(150px, 45vw, 300px);
    height: auto;
    margin-top: clamp(-260px, -40vw, -130px);
    filter: drop-shadow(0 0 25px rgba(120,140,255,0.35));
    animation: float 3.5s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
</style>
</head>
<body>

<canvas id="stars"></canvas>

<div class="content">
  <div class="stack">
    <div class="card">
      <div class="checkmark">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M5 13l4 4L19 7" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <p>حساب کاربری شما ساخته شد<br>لطفاً به برنامه بازگردید 🕊️</p>
    </div>
    <img id="character" src="character-idle.png" alt="کاراکتر">
  </div>
</div>

<script>
/* ---------- Galaxy starfield with occasional comet ---------- */
const starCanvas = document.getElementById('stars');
const sctx = starCanvas.getContext('2d');
let W, H;

function resize() {
  W = starCanvas.width = window.innerWidth;
  H = starCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

const stars = [];
for (let i = 0; i < 220; i++) {
  stars.push({
    x: Math.random() * W,
    y: Math.random() * H,
    r: Math.random() * 1.4 + 0.3,
    tw: Math.random() * Math.PI * 2,
    speed: Math.random() * 0.02 + 0.005
  });
}

let comet = null;
function spawnComet() {
  const fromTop = Math.random() < 0.5;
  comet = {
    x: fromTop ? Math.random() * W * 0.6 : -50,
    y: fromTop ? -50 : Math.random() * H * 0.5,
    vx: 4 + Math.random() * 3,
    vy: 3 + Math.random() * 2,
    life: 0
  };
}
setInterval(() => {
  if (!comet && Math.random() < 0.5) spawnComet();
}, 3500);

function drawGalaxyBg() {
  const grad = sctx.createRadialGradient(W/2, H*0.4, 0, W/2, H*0.4, Math.max(W,H)*0.8);
  grad.addColorStop(0, "#0a0a3a");
  grad.addColorStop(0.5, "#000033");
  grad.addColorStop(1, "#000022");
  sctx.fillStyle = grad;
  sctx.fillRect(0, 0, W, H);
}

function animateStars() {
  drawGalaxyBg();

  stars.forEach(s => {
    s.tw += s.speed;
    const alpha = 0.5 + Math.sin(s.tw) * 0.5;
    sctx.beginPath();
    sctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    sctx.fillStyle = `rgba(255,255,255,${alpha})`;
    sctx.fill();
  });

  if (comet) {
    comet.x += comet.vx;
    comet.y += comet.vy;
    comet.life++;

    const tailLen = 60;
    const grad = sctx.createLinearGradient(
      comet.x, comet.y,
      comet.x - comet.vx * tailLen / 6, comet.y - comet.vy * tailLen / 6
    );
    grad.addColorStop(0, "rgba(255,255,255,0.9)");
    grad.addColorStop(1, "rgba(255,255,255,0)");

    sctx.strokeStyle = grad;
    sctx.lineWidth = 2;
    sctx.beginPath();
    sctx.moveTo(comet.x, comet.y);
    sctx.lineTo(comet.x - comet.vx * tailLen / 6, comet.y - comet.vy * tailLen / 6);
    sctx.stroke();

    sctx.beginPath();
    sctx.arc(comet.x, comet.y, 2.2, 0, Math.PI * 2);
    sctx.fillStyle = "#ffffff";
    sctx.fill();

    if (comet.x > W + 50 || comet.y > H + 50 || comet.life > 300) {
      comet = null;
    }
  }

  requestAnimationFrame(animateStars);
}
animateStars();
</script>

</body>
</html>
